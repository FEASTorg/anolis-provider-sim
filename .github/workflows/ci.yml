name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly: runs the build-only Windows-FluxGraph-ON strict lane off the
    # per-PR path (see windows-fluxgraph-build / anolis-provider-sim#83).
    - cron: "0 7 * * *"

concurrency:
  group: provider-sim-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cpp: ${{ steps.cppfilter.outputs.cpp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.png'
              - '!**/*.svg'
              - '!**/*.jpg'
              - '!**/*.jpeg'
              - '!**/*.gif'
      # Separate OR-filter (default quantifier) for the C++ sources the clang-tidy
      # gate lints, so it skips (and the ok gate stays green) on non-C++ PRs.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: cppfilter
        with:
          filters: |
            cpp:
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '.clang-tidy'

  python-lint:
    name: Python Linting (ruff)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate requirements lockfile
        shell: bash
        run: |
          set -euo pipefail
          LOCKFILE="requirements-lock.txt"
          test -f "$LOCKFILE"
          if od -An -tx1 "$LOCKFILE" | tr -s ' ' '\n' | grep -qx '00'; then
            echo "ERROR: $LOCKFILE contains NUL bytes (binary corruption)" >&2
            exit 1
          fi
          iconv -f UTF-8 -t UTF-8 "$LOCKFILE" > /dev/null 2>&1
          echo "OK: $LOCKFILE is valid UTF-8 and contains no NUL bytes"

      - name: Setup Python and dependencies
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Run ruff checks
        run: |
          ruff check tests examples --output-format=github
          ruff format --check tests examples

  python-typecheck:
    name: Python Type Checking (mypy)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate requirements lockfile
        shell: bash
        run: |
          set -euo pipefail
          LOCKFILE="requirements-lock.txt"
          test -f "$LOCKFILE"
          if od -An -tx1 "$LOCKFILE" | tr -s ' ' '\n' | grep -qx '00'; then
            echo "ERROR: $LOCKFILE contains NUL bytes (binary corruption)" >&2
            exit 1
          fi
          iconv -f UTF-8 -t UTF-8 "$LOCKFILE" > /dev/null 2>&1
          echo "OK: $LOCKFILE is valid UTF-8 and contains no NUL bytes"

      - name: Setup Python and dependencies
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Run mypy
        run: mypy tests examples

  linux-release:
    name: ${{ matrix.lane }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: Linux Release (FluxGraph OFF, strict)
            configure_preset: ci-linux-release-strict
            test_preset: ci-linux-release-strict
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - name: Validate requirements lockfile
        shell: bash
        run: |
          set -euo pipefail
          LOCKFILE="requirements-lock.txt"
          test -f "$LOCKFILE"
          if od -An -tx1 "$LOCKFILE" | tr -s ' ' '\n' | grep -qx '00'; then
            echo "ERROR: $LOCKFILE contains NUL bytes (binary corruption)" >&2
            exit 1
          fi
          iconv -f UTF-8 -t UTF-8 "$LOCKFILE" > /dev/null 2>&1
          echo "OK: $LOCKFILE is valid UTF-8 and contains no NUL bytes"

      - name: Setup Python and dependencies
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@a9b3d134acbcc7dcd6da02c1a345a1fbdca15064 # v2.4
        with:
          triplet: x64-linux-static
          # Subset of the linux-fluxgraph closure (no grpc/fluxgraph). Read-only
          # so this faster lane can't win the save race and freeze the shared key
          # without grpc; linux-fluxgraph is the sole x64-linux-static writer.
          # Required since v2.4 (#97) anchors the key to the consumer manifest, so
          # these lanes — previously key-divergent — now share one key.
          cache-write: "false"

      - name: Build
        run: |
          cmake --preset "${{ matrix.configure_preset }}"
          cmake --build --preset "${{ matrix.configure_preset }}" --parallel

      - name: Test (CTest provider baseline)
        run: ctest --preset "${{ matrix.test_preset }}" -L provider

  provider-conformance:
    name: ADPP Conformance (Linux)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@a9b3d134acbcc7dcd6da02c1a345a1fbdca15064 # v2.4
        with:
          triplet: x64-linux-static
          # Subset of the linux-fluxgraph closure (no grpc/fluxgraph). Read-only
          # so this faster lane can't win the save race and freeze the shared key
          # without grpc; linux-fluxgraph is the sole x64-linux-static writer.
          # Required since v2.4 (#97) anchors the key to the consumer manifest, so
          # these lanes — previously key-divergent — now share one key.
          cache-write: "false"

      - name: Build provider (no hardware)
        run: |
          cmake --preset ci-linux-release-strict
          cmake --build --preset ci-linux-release-strict --parallel

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Pull the pinned anolis-protocol[conformance] harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install "anolis-protocol[conformance] @ https://github.com/anolishq/anolis-protocol/releases/download/v1.6.0/anolis_protocol-1.6.0-py3-none-any.whl"

      - name: Run ADPP conformance against the built binary
        run: |
          anolis-adpp-conformance \
            --provider-bin build/ci-linux-release-strict/anolis-provider-sim \
            --provider-config config/conformance.yaml \
            --provider-profile config/conformance.toml \
            -ra

  windows-release:
    name: ${{ matrix.lane }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: Windows Release (FluxGraph OFF, strict)
            configure_preset: ci-windows-release-strict
            test_preset: ci-windows-release-strict
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate requirements lockfile
        shell: bash
        run: |
          set -euo pipefail
          LOCKFILE="requirements-lock.txt"
          test -f "$LOCKFILE"
          if od -An -tx1 "$LOCKFILE" | tr -s ' ' '\n' | grep -qx '00'; then
            echo "ERROR: $LOCKFILE contains NUL bytes (binary corruption)" >&2
            exit 1
          fi
          iconv -f UTF-8 -t UTF-8 "$LOCKFILE" > /dev/null 2>&1
          echo "OK: $LOCKFILE is valid UTF-8 and contains no NUL bytes"

      - name: Setup Python and dependencies
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@a9b3d134acbcc7dcd6da02c1a345a1fbdca15064 # v2.4
        with:
          triplet: x64-windows-v145
          # FluxGraph-OFF shares the Windows binary-cache key with the
          # FluxGraph-ON job but builds a SUBSET (no grpc). Read-only here so the
          # faster OFF job cannot clobber the shared key with a grpc-less cache;
          # the FluxGraph-ON job is the sole writer. See anolishq/.github#64.
          cache-write: "false"

      - name: Build
        shell: pwsh
        run: |
          cmake --preset "${{ matrix.configure_preset }}"
          cmake --build --preset "${{ matrix.configure_preset }}" --parallel

      - name: Test (CTest provider baseline)
        shell: pwsh
        run: ctest --preset "${{ matrix.test_preset }}" -L provider

  windows-fluxgraph-build:
    name: Windows Release (FluxGraph ON, strict build)
    # Build-only strict validation, kept off the per-PR path (nightly +
    # on-demand) because a cold Windows+FluxGraph build compiles grpc from source
    # (~2 h). NOTE: this lane previously rebuilt grpc every run for a different
    # reason — the vcpkg binary-cache key carried an empty image-version segment
    # (env.ImageVersion never resolved), so it never rotated on runner-image/ABI
    # bumps; an ABI-stale cache hit the key exactly, restored 0 packages, and
    # actions/cache then skipped the post-save (permanent rebuild, NOT 10 GB LRU
    # eviction as once assumed). Fixed in setup-vcpkg v2.3 (anolishq/.github#96).
    # Windows compile stays covered per-PR by the FluxGraph-OFF lane, and
    # Linux+FluxGraph by linux-fluxgraph; the Windows+FluxGraph intersection is
    # validated here nightly. See anolishq/anolis-provider-sim#83.
    # On pull_request/push this job is skipped → the `ok` gate sees 'skipped'
    # (not failure) and stays green.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - name: Checkout provider-sim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@a9b3d134acbcc7dcd6da02c1a345a1fbdca15064 # v2.4
        with:
          triplet: x64-windows-v145

      - name: Build provider-sim (FluxGraph ON)
        shell: pwsh
        # FluxGraph proto is fetched via FetchContent (v1.0.2) during CMake configure.
        # No explicit FLUXGRAPH_DIR needed; set it to override with a local source tree.
        run: |
          cmake --preset "ci-windows-release-fluxgraph-strict"
          cmake --build --preset "ci-windows-release-fluxgraph-strict" --parallel

  linux-fluxgraph:
    name: ${{ matrix.lane }}
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: Linux Release (FluxGraph ON, strict)
            configure_preset: ci-linux-release-fluxgraph-strict
            test_preset: ci-linux-release-fluxgraph-strict
    steps:
      - name: Checkout provider-sim
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve FluxGraph pin
        id: pins
        run: |
          set -euo pipefail
          FLUXGRAPH_REPO=$(awk '/^fluxgraph:/{f=1; next} f && /repository:/{print $2; exit}' .ci/dependency-pins.yml)
          FLUXGRAPH_REF=$(awk '/^fluxgraph:/{f=1; next} f && /ref:/{print $2; exit}' .ci/dependency-pins.yml)
          if [ -z "$FLUXGRAPH_REPO" ] || [ -z "$FLUXGRAPH_REF" ]; then
            echo "Failed to resolve FluxGraph pin from .ci/dependency-pins.yml" >&2
            exit 1
          fi
          echo "repo=$FLUXGRAPH_REPO" >> "$GITHUB_OUTPUT"
          echo "ref=$FLUXGRAPH_REF" >> "$GITHUB_OUTPUT"
          echo "Using FluxGraph pin: $FLUXGRAPH_REPO@$FLUXGRAPH_REF"

      - name: Checkout FluxGraph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.pins.outputs.repo }}
          ref: ${{ steps.pins.outputs.ref }}
          path: fluxgraph

      - name: Log FluxGraph resolved commit
        run: |
          set -euo pipefail
          FLUXGRAPH_SHA=$(git -C fluxgraph rev-parse HEAD)
          FLUXGRAPH_SUBJECT=$(git -C fluxgraph log -1 --pretty=%s)
          echo "FluxGraph requested ref: ${{ steps.pins.outputs.ref }}"
          echo "FluxGraph resolved commit: $FLUXGRAPH_SHA"
          echo "FluxGraph HEAD subject: $FLUXGRAPH_SUBJECT"
          {
            echo "### FluxGraph Resolution (Linux FluxGraph lane)"
            echo ""
            echo "- Ref: \`${{ steps.pins.outputs.ref }}\`"
            echo "- Commit: \`$FLUXGRAPH_SHA\`"
            echo "- Subject: $FLUXGRAPH_SUBJECT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++

      - name: Validate requirements lockfile
        shell: bash
        run: |
          set -euo pipefail
          LOCKFILE="requirements-lock.txt"
          test -f "$LOCKFILE"
          if od -An -tx1 "$LOCKFILE" | tr -s ' ' '\n' | grep -qx '00'; then
            echo "ERROR: $LOCKFILE contains NUL bytes (binary corruption)" >&2
            exit 1
          fi
          iconv -f UTF-8 -t UTF-8 "$LOCKFILE" > /dev/null 2>&1
          echo "OK: $LOCKFILE is valid UTF-8 and contains no NUL bytes"

      - name: Setup Python and dependencies
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@a9b3d134acbcc7dcd6da02c1a345a1fbdca15064 # v2.4
        with:
          triplet: x64-linux-static

      - name: Build FluxGraph server
        working-directory: fluxgraph
        run: |
          cmake --preset ci-linux-release-server
          cmake --build --preset ci-linux-release-server --parallel

      - name: Build provider-sim (FluxGraph ON)
        run: |
          cmake --preset "${{ matrix.configure_preset }}" -DFLUXGRAPH_DIR="$GITHUB_WORKSPACE/fluxgraph"
          cmake --build --preset "${{ matrix.configure_preset }}" --parallel

      - name: Test FluxGraph suites
        run: |
          SERVER_BIN="$(find "$GITHUB_WORKSPACE/fluxgraph/build-server" -type f -name fluxgraph-server | head -n 1)"
          if [ -z "$SERVER_BIN" ]; then
            echo "ERROR: fluxgraph-server binary not found under $GITHUB_WORKSPACE/fluxgraph/build-server" >&2
            exit 1
          fi
          FLUXGRAPH_SERVER_EXE="$SERVER_BIN" ctest --preset "${{ matrix.test_preset }}" -L fluxgraph

  version-sync:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: anolishq/.github/.github/workflows/version-sync.yml@c76784aff711e6540d539f6a5c3ea33c63627930 # v2
    with:
      python-version: '3.12'
      working-directory: '.'

  cpp-format:
    name: C++ Formatting (clang-format)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned clang-tools
        # SHA-verified static LLVM 18.1.8 clang-format on PATH — the org source of
        # truth; install the same pinned binary on dev boxes to match CI. See
        # anolishq/.github#69.
        uses: anolishq/.github/.github/actions/setup-clang-tools@9869a5f4bee7da9c7c1dc9bae033cd0137c4801d # setup-clang-tools
      - name: Check formatting
        run: git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs clang-format --dry-run --Werror

  clang-tidy:
    name: Clang-Tidy (changed lines)
    needs: [changes]
    if: needs.changes.outputs.cpp == 'true'
    permissions:
      contents: read
    uses: anolishq/.github/.github/workflows/clang-tidy-diff.yml@9869a5f4bee7da9c7c1dc9bae033cd0137c4801d # clang-tidy-diff
    with:
      configure-preset: ci-linux-release
      blocking: true

  ok:
    name: ok
    if: always()
    needs:
      - changes
      - python-lint
      - python-typecheck
      - linux-release
      - provider-conformance
      - windows-release
      - windows-fluxgraph-build
      - linux-fluxgraph
      - cpp-format
      - clang-tidy
      - version-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
